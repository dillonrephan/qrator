playlist_length: 40
max_tracks_per_artist: 3
min_distance_same_artist: 10
max_tracks_per_single_source: 5
max_tracks_per_single_playlist: 3
pools:
  direct_shelf: "Tracks from a source the user explicitly supplied."
  one_shelf_away: "Tracks found one bounded discovery hop from a seed."
  corroborated: "Tracks independently surfaced by multiple shelves."
  cross_platform: "Tracks surfaced on more than one platform."
  single_shelf: "Tracks supported by one shelf and retained honestly as uncertain."
  wildcards: "Single-shelf pulls preserved for exploration, not predicted taste."

modes:
  balanced_discovery:
    purpose: "strong playlist with both trust and surprise"
    mix:
      direct_shelf: 0.20
      corroborated: 0.25
      one_shelf_away: 0.30
      single_shelf: 0.15
      wildcards: 0.10

  high_trust:
    purpose: "safest playlist using mostly trusted-source overlap"
    mix:
      direct_shelf: 0.30
      corroborated: 0.40
      cross_platform: 0.20
      wildcards: 0.10

  weird_pull:
    purpose: "intentionally stranger but still justified"
    mix:
      direct_shelf: 0.10
      one_shelf_away: 0.25
      single_shelf: 0.30
      wildcards: 0.20
      corroborated: 0.15

  bridge_builder:
    purpose: "connect distant sounds without making a chaotic playlist"
    mix:
      direct_shelf: 0.15
      corroborated: 0.30
      cross_platform: 0.20
      one_shelf_away: 0.25
      wildcards: 0.10

  bridge_discovery:
    purpose: "bootstrap from distant seeds by raiding sources where humans already connect them"
    mix:
      direct_shelf: 0.10
      corroborated: 0.20
      cross_platform: 0.10
      one_shelf_away: 0.35
      single_shelf: 0.15
      wildcards: 0.10

  heavy_motion:
    purpose: "forward-moving, high-energy playlist"
    mix:
      direct_shelf: 0.15
      corroborated: 0.25
      one_shelf_away: 0.25
      single_shelf: 0.20
      wildcards: 0.15

context_words:
  high:
    - trusted
    - favorite
    - essentials
    - discoveries
    - deep cuts
    - strange
    - raw
    - intense
    - heavy
    - abrasive
    - hypnotic
    - restless
    - leftfield
    - rotation
  medium:
    - night
    - driving
    - work
    - focused
    - weird
    - loud
    - dark
    - bright
    - motion
    - texture
  low:
    - party
    - throwback
    - gym
    - chill
    - sad
  reject:
    - sleep
    - study
    - christmas
    - wedding
    - kids
    - clean
    - radio
